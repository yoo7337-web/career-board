name: 아침 업무 다이제스트

on:
  schedule:
    - cron: '0 22 * * 0-4'   # UTC 22:00 = KST 익일 07:00 (월~금 아침)
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: notion-sync/requirements.txt
      - run: pip install -r notion-sync/requirements.txt
      - run: python notion-sync/digest.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOARD_EMAIL: ${{ secrets.BOARD_EMAIL }}
